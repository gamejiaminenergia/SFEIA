database:
  dsn_env: DB_DSN
  default: postgresql://postgres:postgres@localhost:5432/postgres

creg:
  url_env: CREG_URL
  default: http://localhost:3000/api/ask

ventana:
  # Foco del análisis (H1-2026)
  foco_ini: "2026-01-01"
  foco_fin: "2026-06-30"
  # Fin EXCLUSIVO para la familia C01–C14 (pasar fin+1 día)
  fin_c_familia: "2026-07-01"
  # Fin INCLUSIVO para C15 / C16–C18
  fin_c15: "2026-06-30"
  # Ventana amplia de contexto (ciclo Niño/Niña)
  contexto_ini: "2024-01-01"
  contexto_fin: "2026-07-01"

segmentacion:
  grande_min_gwh: 2000.0
  mediano_min_gwh: 100.0

muestra:
  GRANDE: [ENDC, EPMC, CSIC, CMMC, EPSC, GECC, ISGC]
  MEDIANO: [EMIC, ESSC, CNSC, GNCC, EMSC, NEUC, ETTC, CHVC, DRUC, BIAC]
  PEQUEÑO: [FERC, FREC, EXIC, TPLC, VESC, EBPC, EGVC, GAPC]

modelo_financiero:
  # Misma lógica que C16–C18 (documentada en el plan): estimaciones con
  # precio promedio de sistema. No reemplazan liquidaciones XM.
  pv_tarifa_cop_kwh: 350.0
  cargo_regulado_cop_kwh: 76.1
  factor_cobertura: 0.25
  tasa_costo_anual: 0.02
  incobrables_pct: 0.02
  impuesto_pct: 0.33

informe:
  salida: "docs/informe_estrategias_comercializacion.md"
  titulo: "Informe de Estrategias de Comercialización en el MEM — Benchmark por Segmento (H1-2026)"